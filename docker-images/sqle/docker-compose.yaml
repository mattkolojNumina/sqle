version: '3.1'

services:
  sqle-server:
    image: ${SQLE_IMAGE:-actiontech/sqle-ce:latest}
    container_name: sqle-server
    hostname: sqle-server
    privileged: true
    stdin_open: true
    tty: true
    security_opt:
      - seccomp:unconfined
    networks:
      - sqle_net
    ports:
      - 10000:10000
    environment:
      - MYSQL_HOST=127.0.0.1
      - MYSQL_PORT=33060
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_SQLE_SCHEMA=sqle
      - MYSQL_DMS_SCHEMA=dms
      - CB_HOST=127.0.0.1
      - CB_PORT=8978
      - CB_USER=cbadmin
      - CB_PASSWORD=123456
      - AUTO_MIGRATE_TABLE=true
    volumes:
      - ./config/:/opt/sqle/etc/
      - ./start.sh:/opt/sqle/start.sh
    depends_on:
      - mysql-for-sqle
    command: bash -c "sleep 10 && /opt/start.sh"

  mysql-for-sqle:
    image: mysql:5.7
    container_name: mysql-for-sqle
    hostname: mysql-for-sqle
    privileged: true
    stdin_open: true
    tty: true
    security_opt:
      - seccomp:unconfined
    networks:
      sqle_net:
        ipv4_address: 20.20.20.2
    ports:
      - 33060:3306
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=sqle
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']

  cb-for-sqle:
    image: actiontech/cloudbeaver:latest
    container_name: cb-for-sqle
    privileged: true
    stdin_open: true
    tty: true
    security_opt:
      - seccomp:unconfined
    networks:
      sqle_net:
        ipv4_address: 20.20.20.3
    ports:
      - "8978:8978"
    environment:
      - CB_SERVER_NAME=cb-for-sqle
      - CB_SERVER_URL=http://127.0.0.1:8978
      - CB_ADMIN_NAME=cbadmin
      - CB_ADMIN_PASSWORD=123456
    depends_on:
      - mysql-for-sqle
    entrypoint: ""
    command:
      - bash
      - -c
      - /opt/cloudbeaver/run-server.sh

networks:
  sqle_net:
    driver: bridge
    ipam:
      config:
        - subnet: 20.20.20.0/24
